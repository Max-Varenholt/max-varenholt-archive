<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f4efe6" />
    <title>Archivo temporalmente cerrado | Max Varenholt</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 28px; color: #191713; background: #f4efe6; }
      main { width: min(660px, 100%); border: 1px solid #29251f; background: rgba(255,255,255,.52); padding: clamp(28px, 7vw, 72px); box-shadow: 12px 12px 0 #d6c8b2; }
      .eyebrow { margin: 0 0 28px; font: 700 11px/1.4 Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 11ch; font-size: clamp(46px, 12vw, 92px); line-height: .86; letter-spacing: -.055em; }
      p { max-width: 48ch; margin: 28px 0 0; font-size: clamp(18px, 4.8vw, 23px); line-height: 1.42; }
      small { display: block; margin-top: 30px; font: 12px/1.5 Arial, sans-serif; color: #625b51; }
      button { margin-top: 28px; min-height: 48px; padding: 0 19px; border: 1px solid #191713; border-radius: 999px; background: #191713; color: #fff; font: 700 14px Arial, sans-serif; cursor: pointer; }
      button:focus-visible { outline: 3px solid #d09c37; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Archivo MV · Acceso en pausa</p>
      <h1>Las versiones se están poniendo de acuerdo.</h1>
      <p>Algunas páginas han sido retiradas temporalmente mientras el comité decide cuál de los hechos ocurrió de verdad.</p>
      <button type="button" onclick="location.reload()">Comprobar de nuevo</button>
      <small>Ref. 02:02 · No se ha eliminado ninguna montaña durante esta revisión.</small>
    </main>
  </body>
</html>
